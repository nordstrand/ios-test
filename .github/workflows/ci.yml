name: CI

on:
  push:
  pull_request:

jobs:
  ui-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from test results
        if: always()
        run: |
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import os, shutil

          PNG_MAGIC = b'\x89PNG\r\n\x1a\n'
          os.makedirs("Screenshots", exist_ok=True)
          count = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in files:
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          if fh.read(8) == PNG_MAGIC:
                              dest = f"Screenshots/screenshot_{count}.png"
                              shutil.copy2(path, dest)
                              print(f"Copied: {path} -> {dest}")
                              count += 1
                  except Exception:
                      pass

          print(f"Total screenshots found: {count}")
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots/*.png
          if-no-files-found: warn
