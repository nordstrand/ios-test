name: CI

on:
  push:
  pull_request:

jobs:
  ui-test:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from test results
        if: always()
        run: |
          pip3 install -q --break-system-packages zstandard
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import os, zstandard

          PNG_MAGIC = b'\x89PNG\r\n\x1a\n'
          ZSTD_MAGIC = b'\x28\xb5\x2f\xfd'
          dctx = zstandard.ZstdDecompressor()
          count = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in files:
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          raw = fh.read()
                      if raw[:8] == PNG_MAGIC:
                          data = raw
                      elif raw[:4] == ZSTD_MAGIC:
                          try:
                              data = dctx.decompress(raw, max_output_size=50 * 1024 * 1024)
                          except Exception:
                              continue
                          if data[:8] != PNG_MAGIC:
                              continue
                      else:
                          continue
                      dest = f"Screenshots/screenshot_{count}.png"
                      with open(dest, "wb") as out:
                          out.write(data)
                      print(f"Saved: {dest} (from {path})")
                      count += 1
                  except Exception:
                      pass

          print(f"Total screenshots: {count}")
          PYEOF

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots/*.png
          if-no-files-found: warn

      - name: Post screenshot comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-screenshots -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = 'ci-screenshots';

            let screenshots;
            try {
              screenshots = fs.readdirSync('Screenshots').filter(f => f.endsWith('.png'));
            } catch { screenshots = []; }

            if (!screenshots.length) {
              console.log('No screenshots found, skipping comment');
              return;
            }

            // Ensure ci-screenshots branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch {
              const emptyTree = await github.rest.git.createTree({ owner, repo, tree: [] });
              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: 'Initialize ci-screenshots branch',
                tree: emptyTree.data.sha,
                parents: []
              });
              await github.rest.git.createRef({
                owner, repo,
                ref: `refs/heads/${branch}`,
                sha: commit.data.sha
              });
            }

            // Upload each PNG to ci-screenshots/pr-{N}/
            const urls = [];
            for (const fname of screenshots) {
              const content = fs.readFileSync(`Screenshots/${fname}`).toString('base64');
              const filePath = `pr-${prNumber}/${fname}`;
              let sha;
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
                sha = r.data.sha;
              } catch {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch,
                path: filePath,
                message: `ci: screenshots for PR #${prNumber}`,
                content,
                ...(sha && { sha })
              });
              urls.push(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`);
            }

            // Build comment body
            const body = `${MARKER}\n## UI Test Screenshots\n\n` +
              urls.map((url, i) => `**screenshot_${i}**\n![screenshot_${i}](${url})`).join('\n\n');

            // Update existing comment or post a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log('Updated existing screenshot comment');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              console.log('Posted new screenshot comment');
            }
