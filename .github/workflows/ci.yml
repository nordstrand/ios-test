name: CI

on:
  push:
  pull_request:

jobs:
  ui-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from test results
        if: always()
        run: |
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import json, subprocess, os, sys

          os.makedirs("Screenshots", exist_ok=True)

          # Xcode 16 changed the xcresulttool JSON format; try both
          result = None
          for extra in [["--legacy"], []]:
              try:
                  out = subprocess.check_output(
                      ["xcrun", "xcresulttool", "get",
                       "--path", "TestResults.xcresult",
                       "--format", "json"] + extra,
                      stderr=subprocess.DEVNULL)
                  result = json.loads(out)
                  break
              except Exception:
                  pass

          if result is None:
              print("ERROR: could not parse xcresult JSON", file=sys.stderr)
              sys.exit(0)

          def find_attachments(obj, found=None):
              if found is None:
                  found = []
              if isinstance(obj, dict):
                  if obj.get("_type", {}).get("_name") == "ActionTestAttachment":
                      found.append(obj)
                  for v in obj.values():
                      find_attachments(v, found)
              elif isinstance(obj, list):
                  for item in obj:
                      find_attachments(item, found)
              return found

          count = 0
          for i, att in enumerate(find_attachments(result)):
              payload_id = att.get("payloadRef", {}).get("id")
              uti = att.get("uniformTypeIdentifier", "")
              if not payload_id or "png" not in uti:
                  continue
              name = att.get("name", f"screenshot_{i}").replace(" ", "_")
              out_path = f"Screenshots/{name}_{i}.png"
              r = subprocess.run(
                  ["xcrun", "xcresulttool", "export",
                   "--path", "TestResults.xcresult",
                   "--id", payload_id,
                   "--output-path", out_path,
                   "--type", "file"],
                  capture_output=True)
              if r.returncode == 0 and os.path.exists(out_path):
                  print(f"Exported: {out_path}")
                  count += 1
              else:
                  print(f"Failed to export {out_path}: {r.stderr.decode()}", file=sys.stderr)

          print(f"Total screenshots exported: {count}")
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots/*.png
          if-no-files-found: warn
