name: CI

on:
  push:
  pull_request:

jobs:
  ui-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from test results
        if: always()
        run: |
          mkdir -p Screenshots
          # Export all attachments from the xcresult bundle
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path Screenshots/
          # Flatten nested dirs and keep only PNG files at top level
          find Screenshots -name "*.png" -not -path "Screenshots/*.png" \
            -exec mv {} Screenshots/ \;
          find Screenshots -mindepth 1 -type d -empty -delete

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots/*.png
          if-no-files-found: warn
