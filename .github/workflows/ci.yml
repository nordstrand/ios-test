name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ui-test:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Record bounce animation
        if: always()
        run: |
          mkdir -p Videos
          # Check if a simulator is still booted
          if ! xcrun simctl list devices | grep -q "(Booted)"; then
            echo "No booted simulator, skipping recording"
            exit 0
          fi
          # Start screen recording
          xcrun simctl io booted recordVideo --type mp4 Videos/bounce.mp4 &
          RECORD_PID=$!
          sleep 0.5
          # Relaunch the app to trigger the bounce animation from the start
          xcrun simctl terminate booted com.example.RedCircleApp 2>/dev/null || true
          sleep 0.3
          xcrun simctl launch booted com.example.RedCircleApp
          # Wait for the animation to complete (3s animation + margin)
          sleep 4
          # Stop recording and wait for file to finalise
          kill -SIGINT $RECORD_PID 2>/dev/null || true
          sleep 2
          echo "Recording complete:"
          ls -lh Videos/bounce.mp4 2>/dev/null || echo "bounce.mp4 not found"

      - name: Extract screenshots from test results
        if: always()
        run: |
          pip3 install -q --break-system-packages zstandard
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import os, zstandard

          PNG_MAGIC  = b'\x89PNG\r\n\x1a\n'
          ZSTD_MAGIC = b'\x28\xb5\x2f\xfd'

          dctx = zstandard.ZstdDecompressor()
          pngs = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in files:
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          raw = fh.read()
                      data = raw
                      if raw[:4] == ZSTD_MAGIC:
                          try:
                              data = dctx.decompress(raw, max_output_size=500 * 1024 * 1024)
                          except Exception:
                              continue
                      if data[:8] == PNG_MAGIC:
                          dest = f"Screenshots/screenshot_{pngs}.png"
                          with open(dest, "wb") as f: f.write(data)
                          print(f"PNG: {dest}")
                          pngs += 1
                  except Exception:
                      pass

          print(f"PNGs: {pngs}")
          PYEOF

      - name: Convert bounce video to GIF
        if: always()
        run: |
          if [ -f "Videos/bounce.mp4" ]; then
            ffmpeg -i Videos/bounce.mp4 \
              -vf "fps=12,scale=400:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
              -loop 0 Screenshots/bounce.gif \
              && echo "Created bounce.gif" \
              || echo "ffmpeg conversion failed"
          else
            echo "No bounce.mp4 to convert"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: |
            Screenshots/*.png
            Screenshots/*.gif
          if-no-files-found: warn

      - name: Post media comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-screenshots -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = 'ci-screenshots';

            const media = fs.existsSync('Screenshots')
              ? fs.readdirSync('Screenshots').filter(f => f.endsWith('.png') || f.endsWith('.gif'))
              : [];
            if (!media.length) { console.log('No media'); return; }

            // Ensure ci-screenshots branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: main.data.commit.sha });
            }

            // Upload each file to ci-screenshots/pr-{N}/
            const urls = [];
            for (const fname of media) {
              const content = fs.readFileSync(`Screenshots/${fname}`).toString('base64');
              const filePath = `pr-${prNumber}/${fname}`;
              let sha;
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
                sha = r.data.sha;
              } catch {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch,
                path: filePath,
                message: `ci: media for PR #${prNumber}`,
                content,
                ...(sha && { sha })
              });
              urls.push({ name: fname, url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}` });
            }

            const body = `${MARKER}\n## UI Test Media\n\n` +
              urls.map(({ name, url }) => `**${name}**\n![${name}](${url})`).join('\n\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c => c.body?.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              console.log('Posted new comment');
            }
