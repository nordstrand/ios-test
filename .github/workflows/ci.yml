name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ui-test:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshot from test results
        if: always()
        run: |
          pip3 install -q --break-system-packages zstandard
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import os, zstandard

          PNG_MAGIC  = b'\x89PNG\r\n\x1a\n'
          ZSTD_MAGIC = b'\x28\xb5\x2f\xfd'

          dctx = zstandard.ZstdDecompressor()
          pngs = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in sorted(files):
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          raw = fh.read()
                      data = raw
                      if raw[:4] == ZSTD_MAGIC:
                          try:
                              data = dctx.decompress(raw, max_output_size=500 * 1024 * 1024)
                          except Exception:
                              continue
                      if data[:8] == PNG_MAGIC:
                          dest = f"Screenshots/screenshot_{pngs:03d}.png"
                          with open(dest, "wb") as f: f.write(data)
                          print(f"PNG: {dest} ({len(data)} bytes)")
                          pngs += 1
                  except Exception:
                      pass

          print(f"Total PNGs from xcresult: {pngs}")
          PYEOF

      - name: Capture bounce animation frames via simctl
        if: always()
        run: |
          mkdir -p Screenshots/frames

          # Find the built simulator app bundle
          APP=$(find DerivedData -name "RedCircleApp.app" -type d \
                -path "*/Debug-iphonesimulator/*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "RedCircleApp.app not found in DerivedData, skipping"
            exit 0
          fi
          echo "App bundle: $APP"

          # Find iPhone 16 simulator UDID
          DEVICE=$(python3 - <<'PYEOF'
          import subprocess, re
          out = subprocess.check_output(['xcrun','simctl','list','devices','available']).decode()
          for line in out.split('\n'):
              if 'iPhone 16 (' in line and not any(x in line for x in ['Plus','Pro','Max','mini']):
                  m = re.search(r'[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}', line)
                  if m:
                      print(m.group())
                      break
          PYEOF
          )
          echo "Device: $DEVICE"

          # Boot simulator and wait
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

          # Install the app
          xcrun simctl install "$DEVICE" "$APP"
          echo "App installed"

          # Launch app — onAppear fires, starting the bounce animation
          xcrun simctl launch "$DEVICE" com.example.RedCircleApp
          echo "App launched"

          # Capture 9 frames at 0.4s intervals (covers the 3s animation)
          for i in $(seq 0 8); do
            sleep 0.4
            xcrun simctl io "$DEVICE" screenshot \
              "Screenshots/frames/frame_$(printf '%03d' $i).png" 2>/dev/null \
              && echo "Frame $i captured" \
              || echo "Frame $i failed"
          done

          echo "=== Captured frames ==="
          ls -lh Screenshots/frames/ 2>/dev/null || echo "none"

      - name: Create animated GIF from frames
        if: always()
        run: |
          # Debug: write filesystem state
          {
            echo "=== Screenshots/ ==="
            ls -lh Screenshots/ 2>&1
            echo "=== Screenshots/frames/ ==="
            ls -lh Screenshots/frames/ 2>&1
          } | tee Screenshots/debug.txt

          if ls Screenshots/frames/frame_*.png 1>/dev/null 2>&1; then
            frame_count=$(ls Screenshots/frames/frame_*.png | wc -l | tr -d ' ')
            echo "Creating GIF from $frame_count frames" | tee -a Screenshots/debug.txt
            # Minimal: direct GIF conversion without palette (most compatible)
            ffmpeg -y -framerate 3 -i 'Screenshots/frames/frame_%03d.png' \
              -vf "scale=400:-1:flags=lanczos" \
              -loop 0 Screenshots/bounce.gif 2>&1 | tail -5 | tee -a Screenshots/debug.txt \
              && echo "SUCCESS: bounce.gif created" | tee -a Screenshots/debug.txt \
              || echo "FAILED: ffmpeg exited with error" | tee -a Screenshots/debug.txt
            ls -lh Screenshots/bounce.gif 2>/dev/null | tee -a Screenshots/debug.txt || echo "bounce.gif not found" | tee -a Screenshots/debug.txt
          else
            echo "No frames in Screenshots/frames/, skipping GIF" | tee -a Screenshots/debug.txt
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: |
            Screenshots/*.png
            Screenshots/*.gif
            Screenshots/frames/*.png
          if-no-files-found: warn

      - name: Post media comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-screenshots -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = 'ci-screenshots';

            const gif = fs.existsSync('Screenshots/bounce.gif') ? 'bounce.gif' : null;
            const pngs = fs.existsSync('Screenshots')
              ? fs.readdirSync('Screenshots').filter(f => f.endsWith('.png')).sort()
              : [];
            const staticShot = pngs[pngs.length - 1] ?? null;
            const media = [gif, staticShot].filter(Boolean);

            console.log('GIF:', gif, '  Static:', staticShot, '  All PNGs:', pngs);
            if (!media.length) { console.log('No media'); return; }

            // Ensure ci-screenshots branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: main.data.commit.sha });
            }

            const urls = [];
            for (const fname of media) {
              const content = fs.readFileSync(`Screenshots/${fname}`).toString('base64');
              const filePath = `pr-${prNumber}/${fname}`;
              let sha;
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
                sha = r.data.sha;
              } catch {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch,
                path: filePath,
                message: `ci: media for PR #${prNumber}`,
                content,
                ...(sha && { sha })
              });
              urls.push({ name: fname, url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}` });
            }

            const debugInfo = fs.existsSync('Screenshots/debug.txt')
              ? fs.readFileSync('Screenshots/debug.txt', 'utf8').trim()
              : 'no debug.txt';

            const body = `${MARKER}\n## UI Test Media\n\n` +
              urls.map(({ name, url }) => `**${name}**\n![${name}](${url})`).join('\n\n') +
              `\n\n<details><summary>Debug</summary>\n\n\`\`\`\n${debugInfo}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c => c.body?.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              console.log('Posted new comment');
            }
