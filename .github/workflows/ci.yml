name: CI

on:
  push:
  pull_request:

jobs:
  ui-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Debug xcresult contents
        if: always()
        run: |
          echo "=== xcresult directory tree ==="
          find TestResults.xcresult -type f | sort
          echo "=== file types of first 20 files ==="
          find TestResults.xcresult -type f | head -20 | xargs file

      - name: Extract screenshots from test results
        if: always()
        run: |
          pip3 install -q --break-system-packages zstandard
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import os, zstandard

          PNG_MAGIC = b'\x89PNG\r\n\x1a\n'
          ZSTD_MAGIC = b'\x28\xb5\x2f\xfd'
          dctx = zstandard.ZstdDecompressor()
          count = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in files:
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          raw = fh.read()
                      # Raw PNG
                      if raw[:8] == PNG_MAGIC:
                          data = raw
                      # Zstd-compressed PNG (Xcode 16 xcresult format)
                      elif raw[:4] == ZSTD_MAGIC:
                          try:
                              data = dctx.decompress(raw, max_output_size=50 * 1024 * 1024)
                          except Exception:
                              continue
                          if data[:8] != PNG_MAGIC:
                              continue
                      else:
                          continue
                      dest = f"Screenshots/screenshot_{count}.png"
                      with open(dest, "wb") as out:
                          out.write(data)
                      print(f"Saved: {dest} (from {path})")
                      count += 1
                  except Exception:
                      pass

          print(f"Total screenshots: {count}")
          PYEOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots/*.png
          if-no-files-found: warn
