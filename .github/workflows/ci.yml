name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ui-test:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot simulator
        run: |
          DEVICE_ID=$(python3 - <<'PYEOF'
          import subprocess, re
          out = subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available']).decode()
          for line in out.split('\n'):
              if 'iPhone 16 (' in line and 'Plus' not in line and 'Pro' not in line and 'Max' not in line:
                  m = re.search(r'([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})', line)
                  if m:
                      print(m.group(1))
                      break
          PYEOF
          )
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Start screen recording
        run: |
          mkdir -p Videos
          xcrun simctl io "$DEVICE_ID" recordVideo --type mp4 Videos/bounce.mp4 &
          echo "RECORD_PID=$!" >> $GITHUB_ENV
          echo "Recording started"

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Stop screen recording
        if: always()
        run: |
          if [ -n "$RECORD_PID" ]; then
            kill -SIGINT "$RECORD_PID" 2>/dev/null || true
            sleep 2
          fi

      - name: Extract screenshots from test results
        if: always()
        run: |
          pip3 install -q --break-system-packages zstandard
          mkdir -p Screenshots
          python3 << 'PYEOF'
          import os, zstandard

          PNG_MAGIC  = b'\x89PNG\r\n\x1a\n'
          ZSTD_MAGIC = b'\x28\xb5\x2f\xfd'

          dctx = zstandard.ZstdDecompressor()
          pngs = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in files:
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          raw = fh.read()
                      data = raw
                      if raw[:4] == ZSTD_MAGIC:
                          try:
                              data = dctx.decompress(raw, max_output_size=500 * 1024 * 1024)
                          except Exception:
                              continue
                      if data[:8] == PNG_MAGIC:
                          dest = f"Screenshots/screenshot_{pngs}.png"
                          with open(dest, "wb") as f: f.write(data)
                          print(f"PNG: {dest}")
                          pngs += 1
                  except Exception:
                      pass

          print(f"PNGs: {pngs}")
          PYEOF

      - name: Convert bounce video to GIF
        if: always()
        run: |
          if [ -f "Videos/bounce.mp4" ]; then
            ffmpeg -i Videos/bounce.mp4 \
              -vf "fps=12,scale=400:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
              -loop 0 Screenshots/bounce.gif 2>/dev/null \
              && echo "Created bounce.gif" \
              || echo "ffmpeg conversion failed"
          else
            echo "No bounce.mp4 found"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: |
            Screenshots/*.png
            Screenshots/*.gif
          if-no-files-found: warn

      - name: Post media comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-screenshots -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = 'ci-screenshots';

            const media = fs.existsSync('Screenshots')
              ? fs.readdirSync('Screenshots').filter(f => f.endsWith('.png') || f.endsWith('.gif'))
              : [];
            if (!media.length) { console.log('No media'); return; }

            // Ensure ci-screenshots branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: main.data.commit.sha });
            }

            // Upload each file to ci-screenshots/pr-{N}/
            const urls = [];
            for (const fname of media) {
              const content = fs.readFileSync(`Screenshots/${fname}`).toString('base64');
              const filePath = `pr-${prNumber}/${fname}`;
              let sha;
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
                sha = r.data.sha;
              } catch {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch,
                path: filePath,
                message: `ci: media for PR #${prNumber}`,
                content,
                ...(sha && { sha })
              });
              urls.push({ name: fname, url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}` });
            }

            const body = `${MARKER}\n## UI Test Media\n\n` +
              urls.map(({ name, url }) => `**${name}**\n![${name}](${url})`).join('\n\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c => c.body?.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              console.log('Posted new comment');
            }
