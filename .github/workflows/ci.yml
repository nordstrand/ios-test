name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ui-test:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run UI tests
        run: |
          xcodebuild test \
            -project RedCircleApp.xcodeproj \
            -scheme RedCircleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract screenshots from test results
        if: always()
        run: |
          pip3 install -q --break-system-packages zstandard
          mkdir -p Screenshots

          # Debug: show xcresult file inventory
          echo "=== xcresult files ==="
          find TestResults.xcresult -type f | sort | while read f; do
            size=$(wc -c < "$f")
            header=$(xxd -l 8 "$f" 2>/dev/null | head -1 || echo "?")
            echo "  $size  $f  |  $header"
          done

          python3 << 'PYEOF'
          import os, zstandard

          PNG_MAGIC  = b'\x89PNG\r\n\x1a\n'
          ZSTD_MAGIC = b'\x28\xb5\x2f\xfd'

          dctx = zstandard.ZstdDecompressor()
          pngs = 0

          for root, _, files in os.walk("TestResults.xcresult"):
              for fname in sorted(files):
                  path = os.path.join(root, fname)
                  try:
                      with open(path, "rb") as fh:
                          raw = fh.read()
                      data = raw
                      if raw[:4] == ZSTD_MAGIC:
                          try:
                              data = dctx.decompress(raw, max_output_size=500 * 1024 * 1024)
                          except Exception as e:
                              print(f"ZSTD FAIL {path}: {e}")
                              continue
                      first8 = data[:8].hex()
                      if data[:8] == PNG_MAGIC:
                          dest = f"Screenshots/screenshot_{pngs:03d}.png"
                          with open(dest, "wb") as f: f.write(data)
                          print(f"PNG -> {dest}  (from {path}, {len(data)} bytes)")
                          pngs += 1
                      else:
                          print(f"SKIP {path} header={first8} size={len(data)}")
                  except Exception as e:
                      print(f"ERROR {path}: {e}")

          print(f"Total PNGs: {pngs}")
          PYEOF

      - name: Create animated GIF from bounce frames
        if: always()
        run: |
          cd Screenshots
          frame_count=$(ls screenshot_*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $frame_count PNG frames"
          if [ "$frame_count" -gt 1 ]; then
            ffmpeg -framerate 3 -pattern_type glob -i 'screenshot_*.png' \
              -vf "scale=400:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
              -loop 0 bounce.gif \
              && echo "Created bounce.gif ($(wc -c < bounce.gif) bytes)" \
              || echo "ffmpeg failed"
          else
            echo "Only $frame_count PNG(s), skipping GIF creation"
          fi
          cd ..

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: |
            Screenshots/*.png
            Screenshots/*.gif
          if-no-files-found: warn

      - name: Post media comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-screenshots -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = 'ci-screenshots';

            // Post the GIF if available, otherwise the last PNG
            const allFiles = fs.existsSync('Screenshots')
              ? fs.readdirSync('Screenshots').sort()
              : [];
            const gif = allFiles.find(f => f.endsWith('.gif'));
            const pngs = allFiles.filter(f => f.endsWith('.png'));
            // Last PNG alphabetically is the screenshot from testCircleScreenshot
            const staticShot = pngs[pngs.length - 1];
            const media = [gif, staticShot].filter(Boolean);

            console.log('GIF:', gif, '  Static shot:', staticShot);
            if (!media.length) { console.log('No media found'); return; }

            // Ensure ci-screenshots branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
            } catch {
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: main.data.commit.sha });
            }

            // Upload each file to ci-screenshots/pr-{N}/
            const urls = [];
            for (const fname of media) {
              const content = fs.readFileSync(`Screenshots/${fname}`).toString('base64');
              const filePath = `pr-${prNumber}/${fname}`;
              let sha;
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
                sha = r.data.sha;
              } catch {}
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, branch,
                path: filePath,
                message: `ci: media for PR #${prNumber}`,
                content,
                ...(sha && { sha })
              });
              urls.push({ name: fname, url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}` });
            }

            const body = `${MARKER}\n## UI Test Media\n\n` +
              urls.map(({ name, url }) => `**${name}**\n![${name}](${url})`).join('\n\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c => c.body?.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              console.log('Posted new comment');
            }
